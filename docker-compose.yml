name: offgrid

x-db-credentials: &db-credentials
  POSTGRES_DB: ${POSTGRES_DB:-offgrid}
  POSTGRES_USER: ${POSTGRES_USER:-offgrid}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      <<: *db-credentials
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    image: offgrid-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-offgrid}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-offgrid}
      USE_X_FORWARDED_HOST: "True"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks: [backend, frontend]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    networks: [frontend]
    depends_on:
      web:
        condition: service_healthy

networks:
  frontend:
  backend:
    internal: true   # Postgres is never reachable from outside Docker

volumes:
  postgres_data:
  static_files:
  media_files:
